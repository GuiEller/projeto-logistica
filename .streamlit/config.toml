[theme]
base = "light"
# Cor só nos dados. A moldura do app fica em tinta e cinza, para o olho ir direto ao gráfico.
primaryColor = "#1d5fbf"
backgroundColor = "#f2f4f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0a0a0a"
borderColor = "#e3e6eb"
showWidgetBorder = true
baseRadius = "8px"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]

[client]
# Esconde o botão Deploy e o menu de desenvolvedor. O painel é para leitura.
toolbarMode = "minimal"

[server]
headless = true
